plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.casanova'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springCloudVersion', "2025.1.3")
}

dependencies {
	// Spring Boot Starters (O Data-MongoDB já traz o starter-mongodb internamente)
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

	// O Spring Boot utiliza o starter-web padrão (que contém o webmvc interno)
	implementation 'org.springframework.boot:spring-boot-starter-web'

	// Spring Cloud & Security WebAuthn
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
	implementation 'org.springframework.security:spring-security-webauthn'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

	// MapStruct (Definição da API)
	implementation 'org.mapstruct:mapstruct:1.6.3'

	// API do JWT e Implementações de tempo de execução
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// Lombok (Compilação geral)
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// 🔥 PROCESSADORES DE ANOTAÇÃO (A ordem aqui é vital!)
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

	// Testes (O starter-test unifica e traz JUnit, Mockito, e testes de Web/Security)
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:2.6.0' // Opcional se usar OpenAPI

	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

// 🚀 Garante que o nome dos parâmetros dos métodos seja mantido no bytecode (Spring 6.1+)
tasks.withType(JavaCompile).configureEach {
	options.compilerArgs.add("-parameters")
}

tasks.named('test') {
	useJUnitPlatform()
}
